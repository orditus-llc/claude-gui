// ── Viewer ───────────────────────────────────────────────────────────
const DEFAULT_EMPTY_HTML = `
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
    <path d="m12 19-7-7 7-7M19 12H5"/>
  </svg>
  <span>Select a session to view its conversation</span>`;

const SPARKLE_SVG = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px">
  <path d="M9.5 2 11 6.5 15.5 8 11 9.5 9.5 14 8 9.5 3.5 8 8 6.5Z"/>
  <path d="M18 13v4M16 15h4"/>
</svg>`;

// Hues available to arbitrary, project-invented context tags. Every hue used
// semantically below is held out of this pool, so a context tag can never wear
// the colour that means "bug" or "docs".
const TAG_HUES = ['lime', 'teal', 'cyan', 'pink', 'orange'];

// The six global tags are a closed vocabulary, so their colour is semantic,
// not hashed — and their meaning doesn't vary per project, so the gloss lives
// here rather than being generated and stored per project.
const TAG_TYPES = ['bug', 'feature', 'explore', 'build', 'chore', 'docs'];
const TAG_SEMANTIC = {
  'bug':     'red',
  'bug-fix': 'red',
  'feature': 'green',
  'explore': 'violet',
  'build':   'blue',
  'chore':   'slate',
  'docs':    'amber',
};
const TAG_GLOSS = {
  'bug':     'fixing broken behaviour',
  'feature': 'new capability',
  'explore': 'research, reading, Q&A',
  'build':   'packaging, deps, release',
  'chore':   'upkeep and cleanup',
  'docs':    'writing documentation',
};

// A descriptor tag (bug-fdic-quarterly-pinning) belongs to its type prefix.
// That prefix is the reusable vocabulary — it's what keeps descriptor tags
// groupable and consistently coloured — while the suffix carries the detail.
function tagGroup(tag) {
  const k = String(tag).trim().toLowerCase();
  const prefix = k.split('-')[0];
  return TAG_TYPES.includes(prefix) ? prefix : k;
}

// Semantic where the vocabulary is closed; otherwise FNV-1a over the name, so
// the same context tag always lands on the same hue with nothing stored.
function tagHue(tag) {
  const k = String(tag).trim().toLowerCase();
  if (TAG_SEMANTIC[k]) return TAG_SEMANTIC[k];
  const group = tagGroup(k);
  if (TAG_SEMANTIC[group]) return TAG_SEMANTIC[group];
  let h = 0x811c9dc5;
  for (let i = 0; i < k.length; i++) {
    h ^= k.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return TAG_HUES[(h >>> 0) % TAG_HUES.length];
}
const tagPill = t => `<span class="sx-tag sx-tag--${tagHue(t)}">${esc(t)}</span>`;

// Sessions cited by another session (e.g. "read sessions 1, 2, 3 for context")
// nest under the citing session instead of also appearing at the top level.
// A cited id can point at a session in a different project, so `resolved`
// (from the server, scanning every project's index) fills those in; one still
// not found anywhere just hasn't been organized yet.
function renderProjectIndex(entries, projectLabel, resolved) {
  const byId = new Map(entries.map(e => [e.id, e]));
  const cited = new Set();
  for (const e of entries) for (const id of (e.cites || [])) cited.add(id);

  const topLevel = entries.filter(e => !cited.has(e.id))
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') ||
                    (a.title || '').localeCompare(b.title || ''));

  // Counted by group, not by literal tag: descriptor tags are unique per
  // session, so listing each one would make the legend as long as the table.
  const counts = new Map();
  for (const e of entries) for (const t of (e.tags || [])) {
    const g = tagGroup(t);
    counts.set(g, (counts.get(g) || 0) + 1);
  }

  // A session cited by several parents renders in full under each of them.
  // The repetition is the signal: a session everything cites is an important
  // one, and burying it behind a back-reference just makes you go hunting.
  function node(entry, depth, seen) {
    const known = !!entry.title;
    const sum = (entry.summary || '').trim();
    const dateCell = entry.date || '';
    const kids = (entry.cites || []).filter(id => !seen.has(id));
    const cls = ['sx-row', depth ? 'sx-row--child' : '', known ? '' : 'sx-row--ghost'].filter(Boolean).join(' ');
    const caret = known ? `<span class="sx-caret${sum ? '' : ' sx-caret--empty'}" aria-hidden="true"></span>` : '';
    const citesChip = kids.length ? `<span class="sx-cites">cites ${kids.length}</span>` : '';
    const xproj = entry.projectDir
      ? `<span class="sx-badge" title="${esc(entry.projectDir)}">↗ other project</span>` : '';
    const summary = known ? `
        <div class="sx-summary">
          <p class="sx-sum-text${sum ? '' : ' sx-sum-text--none'}">${sum ? esc(sum) : 'No summary stored for this session — re-run Organize to add one.'}</p>
          <button type="button" class="sx-open-full" data-id="${esc(entry.id)}">Open full conversation ↗</button>
        </div>` : '';
    const attrs = known
      ? ` data-sum tabindex="0" role="button" aria-expanded="false"${sum ? ` title="${esc(sum.slice(0, 140))}"` : ''}`
      : ` title="Cited by another session but not yet indexed — run Organize."`;

    // Only rows belonging to this project get the menu — a cited session from
    // another project can't be re-run against this project's index.
    const menu = entry.local ? `
        <div class="sx-menu-wrap">
          <button type="button" class="sx-kebab" aria-expanded="false" aria-haspopup="true" title="More">⋮</button>
          <div class="sx-menu" hidden>
            <button type="button" class="sx-menu-item" data-rerun="${esc(entry.id)}">Re-run organization</button>
          </div>
        </div>` : '<div></div>';

    const row = `
      <div class="${cls}" style="--d:${depth}" data-id="${esc(entry.id)}"${attrs}>
        <div class="sx-date">${esc(dateCell)}</div>
        <div class="sx-id" title="${esc(entry.id)}">${esc(entry.id.slice(0, 8))}</div>
        <div class="sx-title">${caret}<span class="sx-t"${known ? ` title="${esc(entry.title)}"` : ''}>${known ? esc(entry.title) : 'not yet classified'}</span>${citesChip}${xproj}</div>
        <div class="sx-tags">${(entry.tags || []).map(tagPill).join('')}</div>${menu}${summary}
      </div>`;

    if (!kids.length) return row;
    const inner = kids.map(id => {
      const local = byId.get(id);
      const c = local || (resolved && resolved[id]) || { title: null, tags: [] };
      return node({ ...c, id, local: !!local }, depth + 1, new Set(seen).add(id));
    }).join('');
    return row + `<div class="sx-kids" style="--d:${depth + 1}">${inner}</div>`;
  }

  const extra = [...counts.keys()].filter(t => !TAG_TYPES.includes(t))
    .sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b));
  const legend = [...TAG_TYPES, ...extra].map(g => {
    const label = TAG_TYPES.includes(g) ? `${g}-*` : g;
    const gloss = TAG_GLOSS[g] || '';
    return `
    <div class="sx-leg"><span class="sx-tag sx-tag--${tagHue(g)}">${esc(label)}</span><span class="sx-leg-gloss">${gloss ? '- ' + esc(gloss) : ''}</span><span class="sx-leg-n">${counts.get(g) || 0}</span></div>`;
  }).join('');

  const name = String(projectLabel).replace(/[\\/]+$/, '').split(/[\\/]/).pop() || projectLabel;

  return `
    <div class="sx-wrap">
      <div class="sx-header">
        <div class="sx-h-line">
          <span class="sx-h-name">${esc(name)}</span>
        </div>
        <div class="sx-h-path" title="${esc(projectLabel)}">${esc(projectLabel)}</div>
      </div>
      <div class="sx-legend">
        <div class="sx-legend-cap">Tags (${counts.size})</div>
        <div class="sx-legend-grid">${legend}</div>
      </div>
      <div class="sx-table">
        <div class="sx-row sx-thead" aria-hidden="true">
          <div class="sx-date">date</div><div class="sx-id">session</div>
          <div class="sx-title">title</div><div class="sx-tags">tags</div><div></div>
        </div>
        ${topLevel.map(e => node({ ...e, local: true }, 0, new Set([e.id]))).join('')}
      </div>
    </div>`;
}

const NO_INDEX_HTML = `

  if (e.key !== 'Escape') return;
  const open = document.querySelectorAll('#v-empty .sx-row--open');
  if (!open.length) return;
  open.forEach(r => { r.classList.remove('sx-row--open'); r.setAttribute('aria-expanded', 'false'); });

function bindProjectIndexHandlers() {
  const root = document.getElementById('v-empty');

  // A row reveals its summary; it no longer opens the transcript. Rows open
  // independently — reading several summaries at once is the point.
  root.querySelectorAll('.sx-row[data-sum]').forEach(row => {
    const toggle = () => {
      const open = !row.classList.contains('sx-row--open');
      row.classList.toggle('sx-row--open', open);
      row.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    row.addEventListener('click', e => {
      if (!e.target.closest('.sx-open-full') && !e.target.closest('.sx-menu-wrap')) toggle();
    });
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });

  // the only path from the index to the transcript — [data-id] guards against
  // binding any other button that happens to reuse this class
  root.querySelectorAll('.sx-open-full[data-id]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    openSession(b.dataset.id);
  }));

  root.querySelectorAll('.sx-kebab').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    const menu = btn.nextElementSibling;
    const opening = menu.hidden;
    closeRowMenus();
    menu.hidden = !opening;
    btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
  }));

  root.querySelectorAll('.sx-menu-item[data-rerun]').forEach(item => item.addEventListener('click', e => {
    e.stopPropagation();
    closeRowMenus();
    const projectDir = currentProjectDir();
    if (!projectDir) return;
    openOrganizeModal('Re-run organization');
    startOrganizeRun(projectDir, false, item.dataset.rerun);
  }));
}

function closeRowMenus() {
  document.querySelectorAll('#v-empty .sx-menu').forEach(m => { m.hidden = true; });
  document.querySelectorAll('#v-empty .sx-kebab').forEach(b => b.setAttribute('aria-expanded', 'false'));
}

let emptyRequestToken = 0;
async function showEmpty() {
  activeId = null;
  document.getElementById('v-panel').style.display = 'none';
  const token = ++emptyRequestToken;

  const projectDir = view === 'chats' ? currentProjectDir() : '';
  if (!projectDir) return setEmptyState('centered', DEFAULT_EMPTY_HTML);

  const selected = allSessions.find(s => s.provider === 'claude' && s.projectDir === projectDir);
  const projectLabel = (selected && (selected.cwd || selected.projectDir)) || projectDir;
  setEmptyState('index', '<div class="state"><div class="spinner"></div>Loading index…</div>');
  try {
    const { entries, resolved, error } = await fetch(`/api/project-index?project=${encodeURIComponent(projectDir)}`).then(r => r.json());
    if (token !== emptyRequestToken) return;   // a newer project selection has since superseded this
    if (error) throw new Error(error);
    if (!entries || !entries.length) return setEmptyState('centered', NO_INDEX_HTML);
    setEmptyState('index', renderProjectIndex(entries, projectLabel, resolved));
    bindProjectIndexHandlers();
  } catch {
    if (token !== emptyRequestToken) return;
    setEmptyState('centered', DEFAULT_EMPTY_HTML);
  }
}

// The class and the inline display have to be set together: .v-empty centers a
// one-line placeholder with flex, the index needs normal block flow, and an
// inline display:flex silently overrides .v-empty.has-index no matter what the
// stylesheet says — which is exactly how the index once rendered sideways.
function setEmptyState(mode, html) {
  const empty = document.getElementById('v-empty');
  empty.className = mode === 'index' ? 'v-empty has-index' : 'v-empty';
  empty.style.display = mode === 'index' ? 'block' : 'flex';
  empty.innerHTML = html;
}

}

const ORGANIZE_CONFIRM_OVER = 10;   // ask before committing to a long run

async function runOrganize(force) {
  const projectDir = currentProjectDir();
  if (!projectDir) return;
  document.getElementById('organize-menu').style.display = 'none';
  openOrganizeModal(force ? 'Force re-run' : 'Organize');
  const body = document.getElementById('organize-modal-body');
  body.innerHTML = '<div class="state"><div class="spinner"></div>Checking what needs classifying…</div>';
  try {
    const url = `/api/organize/pending?project=${encodeURIComponent(projectDir)}${force ? '&force=1' : ''}`;
    const { pending, error } = await fetch(url).then(r => r.json());
    if (error) throw new Error(error);
    if (!pending) {
      if (force) {
        body.innerHTML = '<div class="pi-sub">Nothing to re-run — this project has no idle sessions.</div>';
        return;
      }
      // The only place a forced re-run is offered: right where you've just
      // been told there's nothing to do but the summaries still look wrong.
      body.innerHTML = `
        <div class="pi-sub">Nothing new to classify — every idle session in this project is already indexed.</div>
        <div style="display:flex; gap:8px; margin-top:14px">
          <button class="btn-cancel" id="organize-force">Force re-run</button>
        </div>`;
      document.getElementById('organize-force').addEventListener('click', () => runOrganize(true));
      return;
    }
    // A forced run always confirms: it costs money and overwrites work that
    // already exists, regardless of how few sessions are involved.
    if (!force && pending <= ORGANIZE_CONFIRM_OVER) return startOrganizeRun(projectDir, force);

    body.innerHTML = `
      <div class="pi-sub">${force
        ? `Re-classify all ${pending} sessions, replacing their existing titles, tags and summaries.`
        : `${pending} sessions to classify.`}</div>
      <div style="display:flex; gap:8px; margin-top:14px">
        <button class="btn-save" id="organize-confirm">${force ? `Re-run all ${pending}` : `Organize all ${pending}`}</button>
        <button class="btn-cancel" id="organize-cancel">Cancel</button>
      </div>`;
    document.getElementById('organize-cancel').addEventListener('click', closeOrganizeModal);
    document.getElementById('organize-confirm').addEventListener('click', () => startOrganizeRun(projectDir, force));
  } catch (e) {
    body.innerHTML = `<div class="state">Error: ${esc(e.message)}</div>`;
  }
}

// Reads the NDJSON progress stream: one event per session, so the run reports
// as it goes instead of sitting silent until every session is done.
async function readNdjson(resp, onEvent) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();   // trailing partial line waits for the next chunk
    for (const line of lines) if (line.trim()) onEvent(JSON.parse(line));
  }
  if (buffer.trim()) onEvent(JSON.parse(buffer));
}

async function startOrganizeRun(projectDir, force, only) {
  const body = document.getElementById('organize-modal-body');
  body.innerHTML = `
    <div class="pi-sub" id="organize-progress-text">Starting…</div>
    <div class="progress-track"><div class="progress-fill" id="organize-progress-fill"></div></div>
    <div id="organize-progress-list"></div>`;
  const text = document.getElementById('organize-progress-text');
  const fill = document.getElementById('organize-progress-fill');
  const list = document.getElementById('organize-progress-list');

  try {
    const resp = await fetch('/api/organize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project: projectDir, force: !!force, only: only || '' }),
    });
    if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).error || `HTTP ${resp.status}`);

    await readNdjson(resp, evt => {
      if (evt.phase === 'error') throw new Error(evt.error);
      if (evt.phase === 'start') {
        text.textContent = `Classifying ${evt.index} of ${evt.total}…`;
        fill.style.width = `${Math.round(((evt.index - 1) / evt.total) * 100)}%`;
        return;
      }
      if (evt.phase === 'complete') {
        fill.style.width = '100%';
        text.textContent = `Classified ${evt.classified.length}, skipped ${evt.skipped.length}`
          + (evt.failed.length ? `, failed ${evt.failed.length}` : '') + '.';
        return;
      }
      fill.style.width = `${Math.round((evt.index / evt.total) * 100)}%`;
      list.insertAdjacentHTML('beforeend', renderOrganizeRow(evt));
      list.scrollTop = list.scrollHeight;
    });

    allSessions = await fetch('/api/refresh', { method: 'POST' }).then(r => r.json());
    renderProjectOptions();
    renderList();
    if (!activeId) showEmpty();
  } catch (e) {
    body.innerHTML = `<div class="state">Error: ${esc(e.message)}</div>`;
  }
}

function renderOrganizeRow(evt) {
  if (evt.phase === 'failed') {
    return `<div class="pi-row"><div class="pi-title" style="color:var(--red)">${esc(evt.id.slice(0, 8))} — ${esc(evt.error)}</div></div>`;
  }
  if (evt.skipped) {
    return `<div class="pi-row"><div class="pi-title" style="opacity:0.55">${esc(evt.id.slice(0, 8))} — skipped (${esc(evt.skipped)})</div></div>`;
  }
  return `
    <div class="pi-row">
      <div class="pi-title">${esc(evt.title)}</div>
      <div class="pi-tags">${(evt.tags || []).map(t => `<span class="tag-pill">${esc(t)}</span>`).join('')}</div>
    </div>`;
}

async function runPrune() {
  const projectDir = currentProjectDir();
  if (!projectDir) return;
  document.getElementById('organize-menu').style.display = 'none';
  openOrganizeModal('Prune');
  const body = document.getElementById('organize-modal-body');
  body.innerHTML = '<div class="state"><div class="spinner"></div>Looking for stray sessions…</div>';
  try {
    const result = await fetch('/api/prune', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project: projectDir }),
    }).then(r => r.json());
    if (result.error) throw new Error(result.error);
    body.innerHTML = renderPruneResult(result.candidates || []);
    bindPruneResultHandlers();
  } catch (e) {
    body.innerHTML = `<div class="state">Error: ${esc(e.message)}</div>`;
  }
}

function renderPruneResult(candidates) {
  if (!candidates.length) return '<div class="pi-sub">Nothing looks stray in this project — no suggestions.</div>';
  const rows = candidates.map(c => {
    const s = allSessions.find(x => x.provider === 'claude' && x.id === c.sessionId);
    return `
      <div class="pi-row">
        <div style="flex:1; min-width:0">
          <div class="pi-title">${esc(s && s.title || 'Untitled session')}</div>
          <div class="pi-sub" style="margin:2px 0 0">${esc(c.reason)}</div>
        </div>
        <button class="btn-del" data-id="${esc(c.sessionId)}" title="Delete (click twice)">${DEL_SVG}</button>
      </div>`;
  }).join('');
  return `<div class="pi-sub">${candidates.length} candidate${candidates.length === 1 ? '' : 's'} — nothing is deleted until you confirm each one.</div>${rows}`;
}

function bindPruneResultHandlers() {
  document.querySelectorAll('#organize-modal-body .btn-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (pendingPruneDeletes[id]) {
        clearTimeout(pendingPruneDeletes[id]); delete pendingPruneDeletes[id];
        const row = btn.closest('.pi-row');
        fetch(`/api/sessions/${id}?provider=claude`, { method: 'DELETE' })
          .then(r => r.json()).then(data => {
            if (!data.success) throw new Error(data.error || 'Delete failed');
            row.remove();
            allSessions = allSessions.filter(s => sessionKey(s) !== id);
            if (pinned.delete(id)) savePins();
            if (activeId === id) showEmpty();
            renderProjectOptions();
            renderList();
          }).catch(() => {
            fetch('/api/sessions').then(r => r.json()).then(sessions => {
              allSessions = sessions; renderProjectOptions(); renderList();
            });
          });
      } else {
        btn.classList.add('confirming');
        btn.innerHTML = 'Delete?';
        pendingPruneDeletes[id] = setTimeout(() => {
          btn.classList.remove('confirming');
          btn.innerHTML = DEL_SVG;
          delete pendingPruneDeletes[id];
        }, 2000);
      }
    });
  });
}

    : sameDay || !s1 ? fmtFull(s2 || s1)
    : !s2 ? fmtFull(s1)
    : `${fmtShortDate(s1)} &rarr; ${fmtFull(s2)}`;

  // Only offered when a project is selected — that's the only case where

  const backBtn = currentProjectDir() ? `

      </svg>

  vHead.innerHTML = `
    <div class="v-head-row">
      <div class="v-head-main">
        <div class="v-head-title">${esc(session?.title || 'Untitled session')}</div>
        <div class="v-head-meta">${esc(sessionProviderLabel(session))}${session?.cwd ? ' &nbsp;·&nbsp; ' + esc(session.cwd) : ''}${dateMeta ? ' &nbsp;·&nbsp; ' + dateMeta : ''}</div>
      </div>
      ${backBtn}
    </div>`;
  const backEl = document.getElementById('btn-back-index');
  if (backEl) backEl.addEventListener('click', () => showEmpty());

  vBody.innerHTML = '<div class="state"><div class="spinner"></div>Loading conversation…</div>';
  vBody.scrollTop = 0;

  try {
    if (!session) throw new Error('Session not found');
    const provider = session.provider || 'claude';
    const resp = await fetch(`/api/sessions/${session.id}/messages?provider=${encodeURIComponent(provider)}`);
    const messages = await resp.json();
    if (messages.error) throw new Error(messages.error);
    vBody.innerHTML = renderConversation(messages);
    bindViewerHandlers();
  } catch (e) {
    vBody.innerHTML = `<div class="state">Error: ${esc(e.message)}</div>`;
  }
}

// ── Conversation renderer ────────────────────────────────────────────
function renderConversation(messages) {
  if (!messages.length) return '<div class="state">No messages in this session</div>';
  const grouped = groupToolResults(messages);
  let html = '<div class="fade-in">';
  let lastDateStr = '';
  for (const msg of grouped) {
    const ts = msg.timestamp;
    if (ts) {
      const dateStr = fmtFull(ts);
      if (dateStr !== lastDateStr) {
        html += `<div class="date-sep"><span>${esc(dateStr)}</span></div>`;
        lastDateStr = dateStr;
      }
    }
    html += renderTurn(msg);
  }
  return html + '</div>';
}

function groupToolResults(messages) {
  const out = [];
  for (let i = 0; i < messages.length; i++) {
    const msg = messages[i];
    if (msg.type !== 'turn' || msg.role !== 'assistant') { out.push(msg); continue; }

    const toolUses = msg.parts.filter(p => p.kind === 'tool_use');
    if (!toolUses.length) { out.push(msg); continue; }

    const next = messages[i+1];
    if (!next || next.type !== 'turn' || next.role !== 'user') { out.push(msg); continue; }

    const resultMap = {};
    for (const p of next.parts) {
      if (p.kind === 'tool_result') resultMap[p.toolUseId] = p;
    }

    const newParts = msg.parts.map(p => {
      if (p.kind === 'tool_use' && resultMap[p.id]) return { ...p, result: resultMap[p.id] };
      return p;
    });

    out.push({ ...msg, parts: newParts });

    const remainingUserParts = next.parts.filter(p => p.kind !== 'tool_result');
    if (remainingUserParts.length) out.push({ ...next, parts: remainingUserParts });
    i++;
  }
  return out;
}

function renderTurn(msg) {
  if (msg.type === 'summary') {
    return `<div class="summary-sep">Context summarized</div>
            ${msg.text ? `<p class="summary-text">${esc(msg.text)}</p>` : ''}`;
  }
  if (msg.type !== 'turn') return '';

  const ts = `<span class="ts">${fmtTime(msg.timestamp)}</span>`;

  if (msg.role === 'user') {
    const textParts = msg.parts.filter(p => p.kind === 'text');
    if (!textParts.length) return '';
    return `<div class="turn user">
      <div class="turn-label">You ${ts}</div>
      ${textParts.map(p => `<div class="user-text">${esc(p.text)}</div>`).join('')}
    </div>`;
  }

  if (msg.role === 'assistant') {
    const textParts = msg.parts.filter(p => p.kind === 'text');
    const toolParts = msg.parts.filter(p => p.kind === 'tool_use');
    const assistantName = msg.provider === 'codex' ? 'Codex'
      : msg.provider === 'antigravity' ? 'Antigravity'
      : msg.provider === 'chatgpt' ? 'ChatGPT'
      : msg.provider === 'claude-export' ? 'Claude'
      : 'Claude Code';
    return `<div class="turn assistant">
      <div class="turn-label">${assistantName} ${ts}</div>
      <div class="md-body">${textParts.map(p => renderMd(p.text)).join('')}</div>
      ${toolParts.map((p, i) => renderToolUse(p, i)).join('')}
    </div>`;
  }

  return '';
}

let toolCounter = 0;

function renderToolUse(tool, _i) {
  const uid = 'tu-' + (++toolCounter);
  const resultHtml = tool.result ? renderToolResult(tool.result, uid) : '';
  return `<div class="tool-call" id="${uid}">
    <button class="tool-toggle" onclick="toggleBlock('${uid}')">
      <span class="tri" id="tri-${uid}">&#9658;</span>
      <span class="tool-name">${esc(tool.name)}</span>
      <span class="tool-summary">${esc(tool.summary)}</span>
    </button>
    <div class="tool-detail" id="det-${uid}" style="display:none">
      <pre>${esc(tool.inputJson)}</pre>
    </div>
  </div>${resultHtml}`;
}

function renderToolResult(result, parentUid) {
  const uid = 'tr-' + parentUid;
  const lines = result.text.split('\n').length;
  const label = `result  ${lines} line${lines !== 1 ? 's' : ''}${result.truncated ? ' (truncated)' : ''}`;
  return `<div class="tool-result" id="${uid}">
    <button class="tool-toggle" onclick="toggleBlock('${uid}')">
      <span class="tri" id="tri-${uid}">&#9658;</span>
      <span class="tool-name" style="opacity:0.5">&#8627;</span>
      <span class="tool-summary">${esc(label)}</span>
    </button>
    <div class="tool-detail" id="det-${uid}" style="display:none">
      <pre>${esc(result.text)}</pre>
    </div>
  </div>`;
}

function toggleBlock(uid) {
  const det = document.getElementById('det-' + uid);
  const tri = document.getElementById('tri-' + uid);
  if (!det) return;
  const open = det.style.display !== 'none';
  det.style.display = open ? 'none' : 'block';
  if (tri) tri.classList.toggle('open', !open);
}

function bindViewerHandlers() {}

// ── Settings panel ───────────────────────────────────────────────────
async function openSettings() {
  document.getElementById('save-status').textContent = '';
  document.getElementById('save-status').className = 'save-status';
  const num = document.getElementById('cleanup-days');
  const forever = document.getElementById('cleanup-forever');
  const chatgptPath = document.getElementById('chatgpt-export-path');
  const claudePath = document.getElementById('claude-export-path');
  try {
    const settings = await fetch('/api/settings').then(r => r.json());
    // cleanupPeriodDays is an implicit default of 30 when the key is absent (per Claude Code docs)
    const days = settings && Number.isFinite(settings.cleanupPeriodDays) ? settings.cleanupPeriodDays : 30;
    forever.checked = days >= 999999;
    num.value = forever.checked ? 999999 : days;   // show 999999 (disabled) when Forever is on
    num.disabled = forever.checked;
    chatgptPath.value = settings && settings.chatgptExportPath || '';
    claudePath.value = settings && settings.claudeExportPath || '';
  } catch {}
  document.getElementById('settings-modal').style.display = 'flex';
}

function closeSettings() {
  document.getElementById('settings-modal').style.display = 'none';
}

async function saveSettings() {
  const status = document.getElementById('save-status');
  const saveButton = document.getElementById('save-settings');
  let days;
  if (document.getElementById('cleanup-forever').checked) {
    days = 999999;
  } else {
    days = Math.round(Number(document.getElementById('cleanup-days').value));
    if (!Number.isFinite(days) || days < 1) {
      status.textContent = 'Enter a whole number ≥ 1';
      status.className = 'save-status err';
      return;
    }
    if (days > 999998) days = 999998;   // 999999 is reserved for "Forever"
  }
  const originalButton = saveButton.innerHTML;
  saveButton.disabled = true;
  saveButton.setAttribute('aria-busy', 'true');
  saveButton.innerHTML = '<span class="btn-save-spinner"></span>Saving';
  try {
    const response = await fetch('/api/settings', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cleanupPeriodDays: days,
        chatgptExportPath: document.getElementById('chatgpt-export-path').value,
        claudeExportPath: document.getElementById('claude-export-path').value,
      }),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Could not save settings');
    const refreshed = await fetch('/api/refresh', { method: 'POST' });
    const sessions = await refreshed.json();
    if (!refreshed.ok) throw new Error(sessions.error || 'Could not reload sessions');
    allSessions = sessions;
    contentMatches = null;
    renderProjectOptions();
    renderList();
    status.textContent = '✓ Saved';
    status.className = 'save-status ok';
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
    status.className = 'save-status err';
  } finally {
    saveButton.disabled = false;
    saveButton.removeAttribute('aria-busy');
    saveButton.innerHTML = originalButton;
  }
}

// ── Initialise ───────────────────────────────────────────────────────
initTheme();

// Title/path/ID filtering happens instantly on each keystroke; content search
// is debounced to the server. Stale content matches stay visible until the new
// results land, so the list doesn't flicker mid-word.
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = (document.getElementById('search').value || '').trim();
  if (view === 'chats') {
    if (!q) {
      contentMatches = null;
    } else {
      searchTimer = setTimeout(async () => {
        try {
          const matches = await fetch('/api/search?q=' + encodeURIComponent(q)).then(r => r.json());
          // Only apply if the box still holds this query (guards out-of-order responses)
          if ((document.getElementById('search').value || '').trim() === q) {
            contentMatches = matches;
            renderList();
          }
        } catch {}
      }, 200);
    }
  }
  renderList();
});
document.getElementById('sort').addEventListener('change', e => { sortKey = e.target.value; renderList(); });
document.getElementById('project').addEventListener('change', e => {
  projectFilter = e.target.value;
  updateOrganizeButtonState();
  if (!projectFilter) {
    providerFilter = '';
    document.getElementById('provider').value = '';
    renderProjectOptions();
    renderList();
    if (!activeId) showEmpty();
    return;
  }
  const selected = allSessions.find(s => (s.projectKey || s.projectDir) === projectFilter);
  if (selected && (selected.provider === 'chatgpt' || selected.provider === 'claude-export')) {
    providerFilter = selected.provider;
    document.getElementById('provider').value = providerFilter;
    renderProjectOptions();
  }
  renderList();
  if (!activeId) showEmpty();
});
document.getElementById('provider').addEventListener('change', e => {
  providerFilter = e.target.value;
  renderProjectOptions();
  if (activeId && !getFiltered().some(s => sessionKey(s) === activeId)) { activeId = null; showEmpty(); }
  renderList();
});
document.getElementById('btn-organize').addEventListener('click', () => {
  const menu = document.getElementById('organize-menu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
});
document.addEventListener('click', e => {
  if (!e.target.closest('.organize-wrap')) document.getElementById('organize-menu').style.display = 'none';
});
document.getElementById('menu-organize-run').addEventListener('click', () => runOrganize(false));
document.getElementById('menu-prune-run').addEventListener('click', runPrune);
document.getElementById('close-organize').addEventListener('click', closeOrganizeModal);
document.getElementById('organize-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('organize-modal')) closeOrganizeModal();
});
document.getElementById('btn-theme').addEventListener('click', toggleTheme);
document.getElementById('vt-chats').addEventListener('click', () => switchView('chats'));
document.getElementById('vt-memory').addEventListener('click', () => switchView('memory'));
document.getElementById('vt-plugins').addEventListener('click', () => switchView('plugins'));
document.getElementById('cleanup-forever').addEventListener('change', e => {
  const num = document.getElementById('cleanup-days');
  num.disabled = e.target.checked;
  num.value = e.target.checked ? 999999 : 30;   // show 999999 when Forever is on; reset to editable 30 when off
});

const refreshBtn = document.getElementById('btn-refresh');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.classList.add('spinning');
  try {
    allSessions = await fetch('/api/refresh', { method: 'POST' }).then(r => r.json());
    renderProjectOptions();
    if (view === 'memory') {
      try { memProjects = await fetch('/api/memory').then(r => r.json()); memProjectsLoaded = true; } catch {}
    }
    if (view === 'plugins') {
      try { pluginItems = await fetch('/api/plugins').then(r => r.json()); pluginsLoaded = true; } catch {}
    }
    renderList();
    updateOrganizeButtonState();
  } finally { refreshBtn.classList.remove('spinning'); }
});

document.getElementById('btn-settings').addEventListener('click', openSettings);
document.getElementById('close-settings').addEventListener('click', closeSettings);
document.getElementById('save-settings').addEventListener('click', saveSettings);
document.getElementById('settings-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('settings-modal')) closeSettings();
});

async function init() {
  const [sessions, pinsData] = await Promise.all([
    fetch('/api/sessions').then(r => r.json()),
    fetch('/api/pins').then(r => r.json()).catch(() => ({ pins: [] })),
  ]);
  allSessions = sessions;
  pinned = new Set(Array.isArray(pinsData.pins) ? pinsData.pins : []);
  renderProjectOptions();
  renderList();
  updateOrganizeButtonState();
}

init().catch(e => {
  document.getElementById('list').innerHTML = `<div class="state">Error: ${esc(e.message)}</div>`;
});
</script>
